{% if widget.is_initial and not widget.required %}
  <div>
    <input class="pdf-clear" type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
    <label for="{{ widget.checkbox_id }}">Remove current PDF</label>
  </div>
{% endif %}
{% include "django/forms/widgets/input.html" %}
